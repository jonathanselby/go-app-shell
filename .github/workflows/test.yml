name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Acceptance
        run: ./scripts/acceptance.sh
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/app-shell-demo-linux-arm64 ./cmd/app-shell-demo
      - name: Exact asset bytes
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(($(wc -c < shell/assets/shell.css) + $(wc -c < shell/assets/pwa.js)))
          echo "first-party CSS + optional JS: ${bytes} bytes"
          test "$bytes" -le 32768
